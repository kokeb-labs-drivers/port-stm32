---
# Pin hygiene of the example drivers (drivers/drivers.lock.yml): each submodule is a vX.Y.Z or vX.Y.Z-rc.N tag
# whose CI gate passed, never a branch. Calls kokeb-labs/ci-tools ru-pin-hygiene.
name: Pin hygiene

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pins:
    name: Driver pins
    uses: kokeb-labs/ci-tools/.github/workflows/ru-pin-hygiene.yml@v1
    permissions:
      contents: read
    with:
      lock_file: drivers/drivers.lock.yml
      required_check: "CI gate / gate"
      handbook_levels: "high safety"
      forbid_branch_entries: true
