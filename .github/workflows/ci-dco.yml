---
# Developer Certificate of Origin: every commit of a pull request is signed off by its author. Calls
# kokeb-labs/ci-tools dco.
name: DCO

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dco:
    name: Sign-off
    uses: kokeb-labs/ci-tools/.github/workflows/dco.yml@v1
    permissions:
      contents: read
      pull-requests: read
