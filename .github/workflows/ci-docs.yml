---
# Documentation: the drift checks and the strict MkDocs build on the shared theme, published to GitHub Pages
# from main. Calls kokeb-labs/ci-tools ru-mkdocs-publish.
name: Docs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs:
    uses: kokeb-labs/ci-tools/.github/workflows/ru-mkdocs-publish.yml@5fa8e5f4ef6012ada6862f0a0d697ad7c4fff5e2 # v1
    permissions:
      contents: write  # push to the gh-pages deployment branch
    with:
      mkdocs_config: _config/mkdocs.yml
      # Only main and v* tags publish; pull requests never do, and a release/* branch only builds.
      deploy: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
      # Links to the private organisation and the not yet published site cannot be checked from CI.
      link_check: false
      lighthouse: false
      screenshots: false
