<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="bench-h7-wiring-title bench-h7-wiring-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="bench-h7-wiring-title">STM32H7 DMA bench: wiring</title>
<desc id="bench-h7-wiring-desc">SPI1 MOSI PB5 jumpered to MISO PA6; SCK PA5 and CS PD14 to an optional logic analyser; ADC1 inputs PA3, PC0, PB1, PF11, PA0 and PA4 on the mid point of a 10 k / 10 k divider from 3V3; USART3 PD8/PD9 is the ST-LINK virtual COM port at 115200 8N1; SWD through the ST-LINK.</desc>
<rect width="720" height="1040" fill="#FFFFFF"/>
<text x="36" y="58" font-size="30" fill="#1E429F" text-anchor="start" font-weight="700">STM32H7 DMA bench: wiring</text>
<text x="36" y="92" font-size="20" fill="#566070" text-anchor="start" font-weight="400">Nucleo-H743ZI2 class board, one USB cable</text>
<rect x="36" y="120" width="360" height="880" rx="14" fill="#EAF2FF" stroke="#2563EB" stroke-width="3"/>
<text x="216" y="160" font-size="26" fill="#0E1726" text-anchor="middle" font-weight="700">STM32H743</text>
<text x="60" y="250" font-size="19" fill="#566070" text-anchor="start" font-weight="400">SPI1 SCK</text>
<text x="380" y="250" font-size="22" fill="#0E1726" text-anchor="end" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">PA5</text>
<circle cx="396" cy="243" r="7" fill="#2563EB"/>
<text x="60" y="320" font-size="19" fill="#566070" text-anchor="start" font-weight="400">SPI1 MOSI</text>
<text x="380" y="320" font-size="22" fill="#0E1726" text-anchor="end" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">PB5</text>
<circle cx="396" cy="313" r="7" fill="#2563EB"/>
<text x="60" y="390" font-size="19" fill="#566070" text-anchor="start" font-weight="400">SPI1 MISO</text>
<text x="380" y="390" font-size="22" fill="#0E1726" text-anchor="end" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">PA6</text>
<circle cx="396" cy="383" r="7" fill="#2563EB"/>
<text x="60" y="460" font-size="19" fill="#566070" text-anchor="start" font-weight="400">CS (GPIO)</text>
<text x="380" y="460" font-size="22" fill="#0E1726" text-anchor="end" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">PD14</text>
<circle cx="396" cy="453" r="7" fill="#2563EB"/>
<text x="60" y="560" font-size="19" fill="#566070" text-anchor="start" font-weight="400">ADC1 INP15</text>
<text x="380" y="560" font-size="22" fill="#0E1726" text-anchor="end" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">PA3</text>
<circle cx="396" cy="553" r="7" fill="#2563EB"/>
<text x="60" y="610" font-size="19" fill="#566070" text-anchor="start" font-weight="400">ADC1 INP10</text>
<text x="380" y="610" font-size="22" fill="#0E1726" text-anchor="end" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">PC0</text>
<circle cx="396" cy="603" r="7" fill="#2563EB"/>
<text x="60" y="660" font-size="19" fill="#566070" text-anchor="start" font-weight="400">ADC1 INP5</text>
<text x="380" y="660" font-size="22" fill="#0E1726" text-anchor="end" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">PB1</text>
<circle cx="396" cy="653" r="7" fill="#2563EB"/>
<text x="60" y="710" font-size="19" fill="#566070" text-anchor="start" font-weight="400">ADC1 INP2</text>
<text x="380" y="710" font-size="22" fill="#0E1726" text-anchor="end" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">PF11</text>
<circle cx="396" cy="703" r="7" fill="#2563EB"/>
<text x="60" y="760" font-size="19" fill="#566070" text-anchor="start" font-weight="400">ADC1 INP16</text>
<text x="380" y="760" font-size="22" fill="#0E1726" text-anchor="end" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">PA0</text>
<circle cx="396" cy="753" r="7" fill="#2563EB"/>
<text x="60" y="810" font-size="19" fill="#566070" text-anchor="start" font-weight="400">ADC1 INP18</text>
<text x="380" y="810" font-size="22" fill="#0E1726" text-anchor="end" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">PA4</text>
<circle cx="396" cy="803" r="7" fill="#2563EB"/>
<text x="60" y="900" font-size="19" fill="#566070" text-anchor="start" font-weight="400">USART3 VCP</text>
<text x="380" y="900" font-size="22" fill="#0E1726" text-anchor="end" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">PD8/PD9</text>
<circle cx="396" cy="893" r="7" fill="#2563EB"/>
<polyline points="396,313 470,313 470,383 396,383" fill="none" stroke="#C26A05" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="484" y="330" font-size="20" fill="#C26A05" text-anchor="start" font-weight="700">jumper</text>
<text x="484" y="356" font-size="18" fill="#C26A05" text-anchor="start" font-weight="400">MOSI to</text>
<text x="484" y="380" font-size="18" fill="#C26A05" text-anchor="start" font-weight="400">MISO</text>
<polyline points="396,243 596,243" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"/>
<polyline points="396,453 596,453" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"/>
<rect x="596" y="210" width="110" height="270" rx="10" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="651" y="250" font-size="18" fill="#0E1726" text-anchor="middle" font-weight="400">logic</text>
<text x="651" y="274" font-size="18" fill="#0E1726" text-anchor="middle" font-weight="400">analyser</text>
<text x="651" y="302" font-size="16" fill="#566070" text-anchor="middle" font-weight="400">optional</text>
<text x="651" y="350" font-size="16" fill="#566070" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">SCK</text>
<text x="651" y="374" font-size="16" fill="#566070" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">MOSI</text>
<text x="651" y="398" font-size="16" fill="#566070" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">MISO</text>
<text x="651" y="422" font-size="16" fill="#566070" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">CS</text>
<polyline points="396,553 470,553" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="396,603 470,603" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="396,653 470,653" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="396,703 470,703" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="396,753 470,753" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="396,803 470,803" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="470,553 470,803" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="500" y="540" width="200" height="280" rx="10" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="600" y="585" font-size="22" fill="#0E1726" text-anchor="middle" font-weight="600">divider</text>
<text x="600" y="620" font-size="20" fill="#0E1726" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">10 k / 10 k</text>
<text x="600" y="655" font-size="20" fill="#566070" text-anchor="middle" font-weight="400">3V3 to GND</text>
<text x="600" y="690" font-size="19" fill="#566070" text-anchor="middle" font-weight="400">mid point to</text>
<text x="600" y="716" font-size="19" fill="#566070" text-anchor="middle" font-weight="400">all six inputs</text>
<text x="600" y="760" font-size="20" fill="#C26A05" text-anchor="middle" font-weight="400">about 1.65 V</text>
<text x="600" y="792" font-size="18" fill="#566070" text-anchor="middle" font-weight="400">per rank</text>
<polyline points="396,893 500,893" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="500" y="860" width="200" height="110" rx="10" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="600" y="900" font-size="22" fill="#0E1726" text-anchor="middle" font-weight="600">ST-LINK</text>
<text x="600" y="930" font-size="20" fill="#566070" text-anchor="middle" font-weight="400">SWD + VCP</text>
<text x="600" y="956" font-size="18" fill="#566070" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">115200 8N1</text>
<text x="36" y="1028" font-size="17" fill="#566070" text-anchor="start" font-weight="400">The jumper and the divider stay on for every item of the run.</text>
</svg>
