kind: seq
id: spi-transfer
title: One SPI frame
kicker: port-stm32
subtitle: Transfer through SpiDevice and the HAL's interrupt-driven SPI, chip select a GPIO held low for the frame.
alt: >-
  Sequence of an SPI Transfer on the STM32 port, in which the device takes the bus lock, drives its chip select low,
  starts an interrupt-driven HAL transfer, sleeps until the completion callback, and raises chip select whatever the
  result.
reads: >-
  The driver's Transfer call reaches the SpiDevice, which takes the bus lock within its timeout and, when another
  device used the bus last, initialises the HAL SPI again with its own mode and prescaler. It drives its chip select
  GPIO low, starts HAL_SPI_TransmitReceive_IT, and the HAL's interrupt handler clocks the bytes to the Device and
  reads its reply. The task sleeps on the port's Completion until the HAL's completion callback, at most the timeout
  per chunk, then the SpiDevice raises chip select; a timeout aborts the transfer and the peripheral is initialised
  again before the next frame. A kb::Status returns to the driver.
profile: phone
