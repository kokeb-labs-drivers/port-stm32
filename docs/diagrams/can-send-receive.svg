<svg xmlns="http://www.w3.org/2000/svg" width="580" height="860" viewBox="0 0 580 860" role="img" aria-labelledby="can-send-receive-title can-send-receive-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="can-send-receive-title">Sending and receiving a CAN frame</title>
<desc id="can-send-receive-desc">Sequence of a CAN Send and a Receive on the STM32 port, in which Send puts the frame into a free transmit slot of the HAL, the receive interrupt moves every frame into the port's ring, and Receive takes the oldest one.</desc>
<defs><marker id="can-send-receive-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8798"/></marker></defs>
<rect x="0.5" y="0.5" width="579" height="859" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#7A360E">PORT-STM32</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#0E1726">Sending and receiving a CAN frame</text>
<text x="32" y="102.7" font-size="15" fill="#566070">FDCAN (G4, H7) or bxCAN (F4, L4) in classic mode; received</text>
<text x="32" y="124.5" font-size="15" fill="#566070">frames go into the port's ring by interrupt.</text>
<rect x="32" y="140.4" width="516" height="1" fill="#E2E7EE"/>
