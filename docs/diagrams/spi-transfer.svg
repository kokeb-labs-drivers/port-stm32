<path d="M448.5 214.4 L448.5 852.5" fill="none" stroke="#738093" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M108.9 294.4 L130.9 294.4 Q138.9 294.4 138.9 302.4 L138.9 302.4 Q138.9 310.4 130.9 310.4 L108.9 310.4" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M108.9 346.4 L274.5 346.4" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M108.9 442.4 L444.5 442.4" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M108.9 486.4 L274.5 486.4" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M282.5 582.5 L444.5 582.5" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M444.5 626.5 L282.5 626.5" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M274.5 670.5 L108.9 670.5" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M108.9 714.5 L444.5 714.5" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-transfer-arrow-rail)"/>
<rect x="39.5" y="158.4" width="130.8" height="52" rx="10" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<rect x="39.5" y="166.4" width="4" height="36" rx="2" fill="#C26A05"/>
<rect x="213.5" y="158.4" width="130" height="52" rx="10" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<rect x="213.5" y="166.4" width="4" height="36" rx="2" fill="#64748B"/>
<rect x="383.5" y="158.4" width="130" height="52" rx="10" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<rect x="383.5" y="166.4" width="4" height="36" rx="2" fill="#15803D"/>
<rect x="34.9" y="234.4" width="313.5" height="43" rx="10" fill="#EAF2FF" stroke="#BCD2F9" stroke-width="1"/>
<rect x="34.9" y="374.4" width="313.5" height="43" rx="10" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<rect x="34.9" y="514.5" width="313.5" height="43" rx="10" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<rect x="34.9" y="742.5" width="313.5" height="43" rx="10" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<rect x="34.9" y="794.5" width="313.5" height="43" rx="10" fill="#EAF2FF" stroke="#BCD2F9" stroke-width="1"/>
<text x="107.9" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#8A3C0B">SpiDevice</text>
<text x="281.5" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#334155">HAL SPI</text>
<text x="451.5" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#14532D">Device</text>
<text x="48.9" y="261.2" font-size="15" fill="#1E429F">the driver calls Transfer(tx, rx)</text>
<rect x="142.9" y="291.4" width="106.1" height="22" rx="11" fill="#FFFFFF"/>
<text x="196" y="307.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">take bus lock</text>
<rect x="112.9" y="321.4" width="157.5" height="22" rx="11" fill="#FFFFFF"/>
<text x="191.7" y="337.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">Init: mode, prescaler</text>
<text x="48.9" y="401.2" font-size="15" fill="#8A3C0B">only when another device used it last</text>
<rect x="220.5" y="417.4" width="112.4" height="22" rx="11" fill="#FFFFFF"/>
<text x="276.7" y="433.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">CS low (GPIO)</text>
<rect x="115.7" y="461.4" width="151.9" height="22" rx="11" fill="#FFFFFF"/>
<text x="191.7" y="477.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">TransmitReceive_IT</text>
<text x="48.9" y="541.2" font-size="15" fill="#8A3C0B">the task sleeps, at most T</text>
<rect x="318.6" y="557.5" width="89.7" height="22" rx="11" fill="#FFFFFF"/>
<text x="363.5" y="573.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">SCK, MOSI</text>
<rect x="316.5" y="601.5" width="94" height="22" rx="11" fill="#FFFFFF"/>
<text x="363.5" y="617.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">MISO bytes</text>
<rect x="114.7" y="645.5" width="153.9" height="22" rx="11" fill="#FFFFFF"/>
<text x="191.7" y="661.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">completion callback</text>
<rect x="217.6" y="689.5" width="118.2" height="22" rx="11" fill="#FFFFFF"/>
<text x="276.7" y="705.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">CS high (GPIO)</text>
<text x="48.9" y="769.2" font-size="15" fill="#8A3C0B">timeout: abort, Init next frame</text>
<text x="48.9" y="821.2" font-size="15" fill="#1E429F">kb::Status back to the driver</text>
</svg>
