<svg xmlns="http://www.w3.org/2000/svg" width="553" height="868" viewBox="0 0 553 868" role="img" aria-labelledby="spi-transfer-title spi-transfer-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="spi-transfer-title">One SPI frame</title>
<desc id="spi-transfer-desc">Sequence of an SPI Transfer on the STM32 port, in which the device takes the bus lock, drives its chip select low, starts an interrupt-driven HAL transfer, sleeps until the completion callback, and raises chip select whatever the result.</desc>
<defs><marker id="spi-transfer-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker></defs>
<rect x="0.5" y="0.5" width="552" height="867" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#F8D27A">PORT-STM32</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#E8EDF3">One SPI frame</text>
<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Transfer through SpiDevice and the HAL's interrupt-driven SPI,</text>
<text x="32" y="124.5" font-size="15" fill="#9AA6B5">chip select a GPIO held low for the frame.</text>
<rect x="32" y="140.4" width="489" height="1" fill="#252F3C"/>
<path d="M104.9 214.4 L104.9 852.5" fill="none" stroke="#6C7889" stroke-width="1.2" stroke-dasharray="5 5"/>
