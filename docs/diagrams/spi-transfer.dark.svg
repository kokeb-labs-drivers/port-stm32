<path d="M444.5 626.5 L282.5 626.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M274.5 670.5 L108.9 670.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M108.9 714.5 L444.5 714.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-transfer-arrow-rail)"/>
<rect x="39.5" y="158.4" width="130.8" height="52" rx="10" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<rect x="39.5" y="166.4" width="4" height="36" rx="2" fill="#FBBF24"/>
<rect x="213.5" y="158.4" width="130" height="52" rx="10" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
