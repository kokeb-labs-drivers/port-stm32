<rect x="383.5" y="158.4" width="130" height="52" rx="10" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<rect x="383.5" y="166.4" width="4" height="36" rx="2" fill="#4ADE80"/>
<rect x="34.9" y="234.4" width="313.5" height="43" rx="10" fill="#13233A" stroke="#2B4C78" stroke-width="1"/>
<rect x="34.9" y="374.4" width="313.5" height="43" rx="10" fill="#2C2310" stroke="#6A5220" stroke-width="1"/>
