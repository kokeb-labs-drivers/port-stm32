<text x="107.9" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#FDE68A">SpiDevice</text>
<text x="281.5" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#E2E8F0">HAL SPI</text>
<text x="451.5" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#BBF7D0">Device</text>
<text x="48.9" y="261.2" font-size="15" fill="#BFDBFE">the driver calls Transfer(tx, rx)</text>
<rect x="142.9" y="291.4" width="106.1" height="22" rx="11" fill="#0E131A"/>
<text x="196" y="307.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">take bus lock</text>
<rect x="112.9" y="321.4" width="157.5" height="22" rx="11" fill="#0E131A"/>
<text x="191.7" y="337.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">Init: mode, prescaler</text>
<text x="48.9" y="401.2" font-size="15" fill="#FDE68A">only when another device used it last</text>
<rect x="220.5" y="417.4" width="112.4" height="22" rx="11" fill="#0E131A"/>
<text x="276.7" y="433.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">CS low (GPIO)</text>
<rect x="115.7" y="461.4" width="151.9" height="22" rx="11" fill="#0E131A"/>
<text x="191.7" y="477.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">TransmitReceive_IT</text>
<text x="48.9" y="541.2" font-size="15" fill="#FDE68A">the task sleeps, at most T</text>
<rect x="318.6" y="557.5" width="89.7" height="22" rx="11" fill="#0E131A"/>
<text x="363.5" y="573.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">SCK, MOSI</text>
<rect x="316.5" y="601.5" width="94" height="22" rx="11" fill="#0E131A"/>
<text x="363.5" y="617.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">MISO bytes</text>
<rect x="114.7" y="645.5" width="153.9" height="22" rx="11" fill="#0E131A"/>
<text x="191.7" y="661.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">completion callback</text>
<rect x="217.6" y="689.5" width="118.2" height="22" rx="11" fill="#0E131A"/>
<text x="276.7" y="705.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">CS high (GPIO)</text>
<text x="48.9" y="769.2" font-size="15" fill="#FDE68A">timeout: abort, Init next frame</text>
<text x="48.9" y="821.2" font-size="15" fill="#BFDBFE">kb::Status back to the driver</text>
</svg>
