<path d="M448.5 214.4 L448.5 852.5" fill="none" stroke="#6C7889" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M108.9 294.4 L130.9 294.4 Q138.9 294.4 138.9 302.4 L138.9 302.4 Q138.9 310.4 130.9 310.4 L108.9 310.4" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M108.9 346.4 L274.5 346.4" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M108.9 442.4 L444.5 442.4" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-transfer-arrow-rail)"/>
