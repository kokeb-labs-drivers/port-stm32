<title id="port-contracts-title">Contracts on the STM32 port</title>
<desc id="port-contracts-desc">Matrix of the kb-core contracts the STM32 port implements for I2C, SPI, UART, CAN, ADC, PWM, GPIO, clock and log, each marked native, adapted, planned or not available.</desc>
