<path d="M122.3 294.4 L144.3 294.4 Q152.3 294.4 152.3 302.4 L152.3 302.4 Q152.3 310.4 144.3 310.4 L122.3 310.4" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i2c-write-read-arrow-rail)"/>
<path d="M122.3 346.4 L330.4 346.4" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i2c-write-read-arrow-rail)"/>
<path d="M338.4 390.4 L500.4 390.4" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i2c-write-read-arrow-rail)"/>
