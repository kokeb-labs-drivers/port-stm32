<path d="M330.4 478.4 L122.3 478.4" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#i2c-write-read-arrow-rail)"/>
<path d="M122.3 522.5 L330.4 522.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i2c-write-read-arrow-rail)"/>
<path d="M338.4 566.5 L500.4 566.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i2c-write-read-arrow-rail)"/>
<path d="M500.4 610.5 L338.4 610.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#i2c-write-read-arrow-rail)"/>
<path d="M338.4 654.5 L500.4 654.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i2c-write-read-arrow-rail)"/>
<path d="M330.4 698.5 L122.3 698.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#i2c-write-read-arrow-rail)"/>
<path d="M122.3 786.5 L144.3 786.5 Q152.3 786.5 152.3 794.5 L152.3 794.5 Q152.3 802.5 144.3 802.5 L122.3 802.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i2c-write-read-arrow-rail)"/>
<rect x="39.6" y="158.4" width="157.4" height="52" rx="10" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
