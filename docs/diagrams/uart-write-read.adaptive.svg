<defs><marker id="uart-write-read-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fk-f-rail"/></marker></defs>
<rect x="0.5" y="0.5" width="552" height="911" rx="16" class="fk-f-canvas fk-s-frame"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">PORT-STM32</text>
<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">A UART request and reply</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">Both directions run in the port's own UART interrupt handler; the</text>
<text x="32" y="124.5" font-size="15" class="fk-f-muted">HAL only sets the peripheral up.</text>
<rect x="32" y="140.4" width="489" height="1" class="fk-f-hair"/>
