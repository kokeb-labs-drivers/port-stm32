<text x="107.6" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-amber-text">Uart</text>
<text x="281.4" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-slate-text">UART IRQ</text>
<text x="451.4" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-green-text">Device</text>
<text x="48.6" y="261.2" font-size="15" class="fk-f-blue-text">the driver calls Write(tx)</text>
<rect x="142.6" y="291.4" width="86.8" height="22" rx="11" class="fk-f-canvas"/>
<text x="186" y="307.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">writer lock</text>
<rect x="112.6" y="321.4" width="157.7" height="22" rx="11" class="fk-f-canvas"/>
<text x="191.5" y="337.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">enable TXE interrupt</text>
<rect x="301" y="365.4" width="124.6" height="22" rx="11" class="fk-f-canvas"/>
<text x="363.4" y="381.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">TX byte by byte</text>
<rect x="137.9" y="409.4" width="107.3" height="22" rx="11" class="fk-f-canvas"/>
<text x="191.5" y="425.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">last byte sent</text>
<text x="48.6" y="489.2" font-size="15" class="fk-f-amber-text">with DE: DE low at transmit-complete</text>
<text x="48.6" y="541.2" font-size="15" class="fk-f-blue-text">the driver calls Read(rx, timeout)</text>
<rect x="142.6" y="571.5" width="92" height="22" rx="11" class="fk-f-canvas"/>
<text x="188.7" y="587.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">reader lock</text>
<text x="48.6" y="637.2" font-size="15" class="fk-f-amber-text">sleeps while the ring is empty</text>
<rect x="327.4" y="653.5" width="71.9" height="22" rx="11" class="fk-f-canvas"/>
<text x="363.4" y="669.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">RX reply</text>
<rect x="316.4" y="711.5" width="96.9" height="22" rx="11" class="fk-f-canvas"/>
<text x="364.8" y="727.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">into the ring</text>
<rect x="166.6" y="741.5" width="49.7" height="22" rx="11" class="fk-f-canvas"/>
<text x="191.5" y="757.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">wake</text>
<rect x="142.6" y="799.5" width="154.9" height="22" rx="11" class="fk-f-canvas"/>
<text x="220.1" y="815.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">take bytes from ring</text>
<text x="48.6" y="865.2" font-size="15" class="fk-f-blue-text">byte count back to the driver</text>
</svg>
