<rect x="439.4" y="166.4" width="4" height="36" rx="2" fill="#15803D"/>
<rect x="48.3" y="234.4" width="356.2" height="43" rx="10" fill="#EAF2FF" stroke="#BCD2F9" stroke-width="1"/>
<rect x="48.3" y="726.5" width="356.2" height="43" rx="10" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<rect x="48.3" y="822.5" width="356.2" height="43" rx="10" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<rect x="48.3" y="874.5" width="356.2" height="43" rx="10" fill="#EAF2FF" stroke="#BCD2F9" stroke-width="1"/>
<text x="121.3" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#8A3C0B">I2cController</text>
<text x="337.4" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#334155">HAL I2C</text>
<text x="507.4" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#14532D">Device</text>
<text x="62.3" y="261.2" font-size="15" fill="#1E429F">the driver calls WriteRead</text>
<rect x="156.3" y="291.4" width="76" height="22" rx="11" fill="#FFFFFF"/>
<text x="194.3" y="307.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">take lock</text>
<rect x="126.3" y="321.4" width="200.2" height="22" rx="11" fill="#FFFFFF"/>
<text x="226.4" y="337.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">Seq_Transmit_IT, no STOP</text>
<rect x="345.1" y="365.4" width="148.6" height="22" rx="11" fill="#FFFFFF"/>
<text x="419.4" y="381.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">START, addr+W, tx</text>
<rect x="397.6" y="409.4" width="43.6" height="22" rx="11" fill="#FFFFFF"/>
<text x="419.4" y="425.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">ACK</text>
<rect x="165.5" y="453.4" width="121.7" height="22" rx="11" fill="#FFFFFF"/>
<text x="226.4" y="469.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">TxCplt callback</text>
<rect x="164.6" y="497.4" width="123.5" height="22" rx="11" fill="#FFFFFF"/>
<text x="226.4" y="513.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">Seq_Receive_IT</text>
<rect x="375.5" y="541.5" width="87.8" height="22" rx="11" fill="#FFFFFF"/>
<text x="419.4" y="557.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">Sr, addr+R</text>
<rect x="384.7" y="585.5" width="69.4" height="22" rx="11" fill="#FFFFFF"/>
<text x="419.4" y="601.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">rx bytes</text>
<rect x="393.4" y="629.5" width="52.2" height="22" rx="11" fill="#FFFFFF"/>
<text x="419.4" y="645.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">STOP</text>
<rect x="165.6" y="673.5" width="121.6" height="22" rx="11" fill="#FFFFFF"/>
<text x="226.4" y="689.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">RxCplt callback</text>
<text x="62.3" y="753.2" font-size="15" fill="#8A3C0B">both phases within one timeout</text>
<rect x="156.3" y="783.5" width="66.6" height="22" rx="11" fill="#FFFFFF"/>
<text x="189.6" y="799.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">classify</text>
<text x="62.3" y="849.2" font-size="15" fill="#8A3C0B">a line held low runs RecoverBus</text>
<text x="62.3" y="901.2" font-size="15" fill="#1E429F">kb::Status back to the driver</text>
</svg>
