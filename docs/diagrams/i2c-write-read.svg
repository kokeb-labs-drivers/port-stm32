<svg xmlns="http://www.w3.org/2000/svg" width="609" height="948" viewBox="0 0 609 948" role="img" aria-labelledby="i2c-write-read-title i2c-write-read-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="i2c-write-read-title">One I2C register read</title>
<desc id="i2c-write-read-desc">Sequence of an I2C WriteRead on the STM32 port, in which the controller sends the register address without a STOP, sleeps until the HAL's callback, then reads the reply after a repeated START and classifies the result.</desc>
<defs><marker id="i2c-write-read-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8798"/></marker></defs>
<rect x="0.5" y="0.5" width="608" height="947" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#7A360E">PORT-STM32</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#0E1726">One I2C register read</text>
<text x="32" y="102.7" font-size="15" fill="#566070">WriteRead as two interrupt-driven HAL sequential transfers joined by a</text>
<text x="32" y="124.5" font-size="15" fill="#566070">repeated START.</text>
<rect x="32" y="140.4" width="545" height="1" fill="#E2E7EE"/>
<path d="M118.3 214.4 L118.3 932.5" fill="none" stroke="#738093" stroke-width="1.2" stroke-dasharray="5 5"/>
