<svg xmlns="http://www.w3.org/2000/svg" width="553" height="912" viewBox="0 0 553 912" role="img" aria-labelledby="uart-write-read-title uart-write-read-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="uart-write-read-title">A UART request and reply</title>
<desc id="uart-write-read-desc">Sequence of a UART Write followed by a Read on the STM32 port, in which the port's interrupt handler sends the frame byte by byte, puts the reply into the port's receive ring, and wakes the Read that waits for it.</desc>
<defs><marker id="uart-write-read-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker></defs>
<rect x="0.5" y="0.5" width="552" height="911" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#F8D27A">PORT-STM32</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#E8EDF3">A UART request and reply</text>
<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Both directions run in the port's own UART interrupt handler; the</text>
<text x="32" y="124.5" font-size="15" fill="#9AA6B5">HAL only sets the peripheral up.</text>
<rect x="32" y="140.4" width="489" height="1" fill="#252F3C"/>
<path d="M104.6 214.4 L104.6 896.5" fill="none" stroke="#6C7889" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M278.4 214.4 L278.4 896.5" fill="none" stroke="#6C7889" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M448.4 214.4 L448.4 896.5" fill="none" stroke="#6C7889" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M108.6 294.4 L130.6 294.4 Q138.6 294.4 138.6 302.4 L138.6 302.4 Q138.6 310.4 130.6 310.4 L108.6 310.4" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uart-write-read-arrow-rail)"/>
<path d="M108.6 346.4 L274.4 346.4" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uart-write-read-arrow-rail)"/>
<path d="M282.4 390.4 L444.4 390.4" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uart-write-read-arrow-rail)"/>
<path d="M274.4 434.4 L108.6 434.4" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#uart-write-read-arrow-rail)"/>
<path d="M108.6 574.5 L130.6 574.5 Q138.6 574.5 138.6 582.5 L138.6 582.5 Q138.6 590.5 130.6 590.5 L108.6 590.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uart-write-read-arrow-rail)"/>
<path d="M444.4 678.5 L282.4 678.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#uart-write-read-arrow-rail)"/>
<path d="M282.4 714.5 L304.4 714.5 Q312.4 714.5 312.4 722.5 L312.4 722.5 Q312.4 730.5 304.4 730.5 L282.4 730.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uart-write-read-arrow-rail)"/>
<path d="M274.4 766.5 L108.6 766.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#uart-write-read-arrow-rail)"/>
<path d="M108.6 802.5 L130.6 802.5 Q138.6 802.5 138.6 810.5 L138.6 810.5 Q138.6 818.5 130.6 818.5 L108.6 818.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uart-write-read-arrow-rail)"/>
<rect x="39.6" y="158.4" width="130" height="52" rx="10" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<rect x="39.6" y="166.4" width="4" height="36" rx="2" fill="#FBBF24"/>
<rect x="213.4" y="158.4" width="130" height="52" rx="10" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<rect x="213.4" y="166.4" width="4" height="36" rx="2" fill="#94A3B8"/>
<rect x="383.4" y="158.4" width="130" height="52" rx="10" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<rect x="383.4" y="166.4" width="4" height="36" rx="2" fill="#4ADE80"/>
<rect x="34.6" y="234.4" width="313.7" height="43" rx="10" fill="#13233A" stroke="#2B4C78" stroke-width="1"/>
<rect x="34.6" y="462.4" width="313.7" height="43" rx="10" fill="#2C2310" stroke="#6A5220" stroke-width="1"/>
<rect x="34.6" y="514.5" width="313.7" height="43" rx="10" fill="#13233A" stroke="#2B4C78" stroke-width="1"/>
<rect x="34.6" y="610.5" width="313.7" height="43" rx="10" fill="#2C2310" stroke="#6A5220" stroke-width="1"/>
<rect x="34.6" y="838.5" width="313.7" height="43" rx="10" fill="#13233A" stroke="#2B4C78" stroke-width="1"/>
<text x="107.6" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#FDE68A">Uart</text>
<text x="281.4" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#E2E8F0">UART IRQ</text>
<text x="451.4" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#BBF7D0">Device</text>
<text x="48.6" y="261.2" font-size="15" fill="#BFDBFE">the driver calls Write(tx)</text>
<rect x="142.6" y="291.4" width="86.8" height="22" rx="11" fill="#0E131A"/>
<text x="186" y="307.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">writer lock</text>
<rect x="112.6" y="321.4" width="157.7" height="22" rx="11" fill="#0E131A"/>
<text x="191.5" y="337.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">enable TXE interrupt</text>
<rect x="301" y="365.4" width="124.6" height="22" rx="11" fill="#0E131A"/>
<text x="363.4" y="381.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">TX byte by byte</text>
<rect x="137.9" y="409.4" width="107.3" height="22" rx="11" fill="#0E131A"/>
<text x="191.5" y="425.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">last byte sent</text>
<text x="48.6" y="489.2" font-size="15" fill="#FDE68A">with DE: DE low at transmit-complete</text>
<text x="48.6" y="541.2" font-size="15" fill="#BFDBFE">the driver calls Read(rx, timeout)</text>
<rect x="142.6" y="571.5" width="92" height="22" rx="11" fill="#0E131A"/>
<text x="188.7" y="587.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">reader lock</text>
<text x="48.6" y="637.2" font-size="15" fill="#FDE68A">sleeps while the ring is empty</text>
<rect x="327.4" y="653.5" width="71.9" height="22" rx="11" fill="#0E131A"/>
<text x="363.4" y="669.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">RX reply</text>
<rect x="316.4" y="711.5" width="96.9" height="22" rx="11" fill="#0E131A"/>
<text x="364.8" y="727.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">into the ring</text>
<rect x="166.6" y="741.5" width="49.7" height="22" rx="11" fill="#0E131A"/>
<text x="191.5" y="757.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">wake</text>
<rect x="142.6" y="799.5" width="154.9" height="22" rx="11" fill="#0E131A"/>
<text x="220.1" y="815.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">take bytes from ring</text>
<text x="48.6" y="865.2" font-size="15" fill="#BFDBFE">byte count back to the driver</text>
</svg>
