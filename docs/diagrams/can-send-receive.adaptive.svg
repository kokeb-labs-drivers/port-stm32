<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">PORT-STM32</text>
<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">Sending and receiving a CAN frame</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">FDCAN (G4, H7) or bxCAN (F4, L4) in classic mode; received</text>
<text x="32" y="124.5" font-size="15" class="fk-f-muted">frames go into the port's ring by interrupt.</text>
