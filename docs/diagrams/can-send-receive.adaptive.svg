<text x="125.5" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-amber-text">CanController</text>
<text x="303.1" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-slate-text">HAL CAN</text>
<text x="473.1" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-green-text">Other node</text>
<text x="66.5" y="261.2" font-size="15" class="fk-f-blue-text">the driver calls Send(frame, t)</text>
<rect x="160.5" y="291.4" width="80.3" height="22" rx="11" class="fk-f-canvas"/>
<text x="200.6" y="307.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">send lock</text>
<rect x="133.4" y="321.4" width="155.6" height="22" rx="11" class="fk-f-canvas"/>
<text x="211.3" y="337.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">add to a free TX slot</text>
<text x="66.5" y="401.2" font-size="15" class="fk-f-amber-text">none free: sleep for TX complete</text>
<rect x="164.4" y="417.4" width="93.8" height="22" rx="11" class="fk-f-canvas"/>
<text x="211.3" y="433.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">queued: Ok</text>
<rect x="318.9" y="461.4" width="132.2" height="22" rx="11" class="fk-f-canvas"/>
<text x="385.1" y="477.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">frame on the bus</text>
<rect x="348.4" y="505.4" width="73.3" height="22" rx="11" class="fk-f-canvas"/>
<text x="385.1" y="521.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">ACK slot</text>
<rect x="329.4" y="549.5" width="111.2" height="22" rx="11" class="fk-f-canvas"/>
<text x="385.1" y="565.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">a frame for us</text>
<rect x="130.5" y="593.5" width="161.6" height="22" rx="11" class="fk-f-canvas"/>
<text x="211.3" y="609.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">RX callback: into ring</text>
<text x="66.5" y="673.2" font-size="15" class="fk-f-blue-text">the driver calls Receive(frame, t)</text>
<rect x="160.5" y="703.5" width="98.2" height="22" rx="11" class="fk-f-canvas"/>
<text x="209.6" y="719.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">receive lock</text>
<rect x="160.5" y="747.5" width="151.4" height="22" rx="11" class="fk-f-canvas"/>
<text x="236.2" y="763.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">oldest frame of ring</text>
<text x="66.5" y="813.2" font-size="15" class="fk-f-amber-text">frames lost: Overflow next time</text>
</svg>
