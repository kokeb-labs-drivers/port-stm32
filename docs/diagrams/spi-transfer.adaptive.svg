<defs><marker id="spi-transfer-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fk-f-rail"/></marker></defs>
<rect x="0.5" y="0.5" width="552" height="867" rx="16" class="fk-f-canvas fk-s-frame"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">PORT-STM32</text>
<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">One SPI frame</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">Transfer through SpiDevice and the HAL's interrupt-driven SPI,</text>
<text x="32" y="124.5" font-size="15" class="fk-f-muted">chip select a GPIO held low for the frame.</text>
<rect x="32" y="140.4" width="489" height="1" class="fk-f-hair"/>
<path d="M104.9 214.4 L104.9 852.5" fill="none" stroke-width="1.2" stroke-dasharray="5 5" class="fk-s-line"/>
