<text x="107.9" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-amber-text">SpiDevice</text>
<text x="281.5" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-slate-text">HAL SPI</text>
<text x="451.5" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-green-text">Device</text>
<text x="48.9" y="261.2" font-size="15" class="fk-f-blue-text">the driver calls Transfer(tx, rx)</text>
<rect x="142.9" y="291.4" width="106.1" height="22" rx="11" class="fk-f-canvas"/>
<text x="196" y="307.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">take bus lock</text>
<rect x="112.9" y="321.4" width="157.5" height="22" rx="11" class="fk-f-canvas"/>
<text x="191.7" y="337.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">Init: mode, prescaler</text>
<text x="48.9" y="401.2" font-size="15" class="fk-f-amber-text">only when another device used it last</text>
<rect x="220.5" y="417.4" width="112.4" height="22" rx="11" class="fk-f-canvas"/>
<text x="276.7" y="433.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">CS low (GPIO)</text>
<rect x="115.7" y="461.4" width="151.9" height="22" rx="11" class="fk-f-canvas"/>
<text x="191.7" y="477.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">TransmitReceive_IT</text>
<text x="48.9" y="541.2" font-size="15" class="fk-f-amber-text">the task sleeps, at most T</text>
<rect x="318.6" y="557.5" width="89.7" height="22" rx="11" class="fk-f-canvas"/>
<text x="363.5" y="573.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">SCK, MOSI</text>
<rect x="316.5" y="601.5" width="94" height="22" rx="11" class="fk-f-canvas"/>
<text x="363.5" y="617.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">MISO bytes</text>
<rect x="114.7" y="645.5" width="153.9" height="22" rx="11" class="fk-f-canvas"/>
<text x="191.7" y="661.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">completion callback</text>
<rect x="217.6" y="689.5" width="118.2" height="22" rx="11" class="fk-f-canvas"/>
<text x="276.7" y="705.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">CS high (GPIO)</text>
<text x="48.9" y="769.2" font-size="15" class="fk-f-amber-text">timeout: abort, Init next frame</text>
<text x="48.9" y="821.2" font-size="15" class="fk-f-blue-text">kb::Status back to the driver</text>
</svg>
