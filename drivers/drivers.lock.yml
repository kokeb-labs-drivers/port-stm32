# The drivers the STM32 examples bind through the port (examples/stm32), one entry per submodule under drivers/.
# Pin hygiene (ci-pins.yml) checks that each entry's commit equals the gitlink, that the tag points at that commit
# and matches vX.Y.Z or vX.Y.Z-rc.N (never a branch), and that the tag's CI gate concluded success. The same pins
# as kb-core's drivers/drivers.lock.yml at the kb-core commit in third_party/kb-core.lock.
drivers:
  - name: pcal9555
    repo: kokeb-labs-drivers/driver-pcal9555
    tag: v0.1.0-rc.1
    commit: b9dabab24897cc5392c35e024e63fbc970fe7f19
    kind: rc
  - name: tmc5160
    repo: kokeb-labs-drivers/driver-tmc5160
    tag: v0.1.0-rc.1
    commit: 9ef0483e64ffe1bb1d6744a063c7577b992a4e51
    kind: rc
  - name: bno08x
