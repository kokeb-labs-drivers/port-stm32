# Documentation site on the shared MkDocs platform (kokeb-mkdocs-theme from kokeb-labs/ci-tools). From the root:
#   mkdocs serve -f _config/mkdocs.yml               http://127.0.0.1:8000
#   mkdocs build -f _config/mkdocs.yml --strict      what CI runs
#   kokeb-docs check                                  the drift checks CI runs first
site_name: port-stm32
site_description: >-
  kb-core's bus, pin, clock and log contracts implemented over the STM32Cube HAL for STM32 G4, H7, F4 and L4.
repo_url: https://github.com/kokeb-labs-drivers/port-stm32
copyright: Copyright (c) 2026 The port-stm32 authors
docs_dir: ../docs
site_dir: ../site

theme:
  name: kokeb

plugins:
  - kokeb
  - search
  - awesome-nav
