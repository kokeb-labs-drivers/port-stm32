<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">One I2C register read</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">WriteRead as two interrupt-driven HAL sequential transfers joined by a</text>
<text x="32" y="124.5" font-size="15" class="fk-f-muted">repeated START.</text>
