kind: seq
id: uart-write-read
title: A UART request and reply
kicker: port-stm32
subtitle: Both directions run in the port's own UART interrupt handler; the HAL only sets the peripheral up.
alt: >-
  Sequence of a UART Write followed by a Read on the STM32 port, in which the port's interrupt handler sends the
  frame byte by byte, puts the reply into the port's receive ring, and wakes the Read that waits for it.
reads: >-
  The driver's Write call reaches the Uart, which takes its writer lock and enables the transmit-empty interrupt;
  the port's UART IRQ handler then sends the frame to the Device byte by byte and completes the write at the last
  byte, with a DE pin at transmit-complete. The driver's Read call takes the reader lock and sleeps while the ring
  is empty, at most its timeout. The Device's reply arrives on RX, and the UART IRQ handler puts each byte into the
  port's ring of 256 bytes, latches any receive error and wakes the Read, which takes what the ring holds; the
  count returns to the driver.
