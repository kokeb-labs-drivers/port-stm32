kind: seq
id: i2c-write-read
title: One I2C register read
kicker: port-stm32
subtitle: WriteRead as two interrupt-driven HAL sequential transfers joined by a repeated START.
alt: >-
  Sequence of an I2C WriteRead on the STM32 port, in which the controller sends the register address without a STOP,
  sleeps until the HAL's callback, then reads the reply after a repeated START and classifies the result.
reads: >-
  The driver's WriteRead call reaches the I2cController, which takes its lock within the timeout and clears stale
  transfer state in the peripheral. It starts HAL_I2C_Master_Seq_Transmit_IT without a STOP; the HAL I2C interrupt
  handler sends START, the address with the write bit and the register bytes to the Device, and its completion
  callback wakes the task. The controller then starts HAL_I2C_Master_Seq_Receive_IT, which sends a repeated START
  and the address with the read bit, reads the reply and ends with STOP. Both phases share one timeout on the port's
  clock; the controller classifies the HAL status and error code, restores the handle after a failure, runs the bus
  recovery when SDA or SCL stays low, and returns a kb::Status to the driver.
profile: phone
print: portrait
sources:
